document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e-between;gap:10px\">\n        <span style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#c9799a;font-weight:700\">Tap through it →<\u002Fspan>\n        <span style=\"font-family:'Caveat',cursive;font-size:22px;color:#b5305f\">yours, Satvik<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"height:22px\"><\u002Fdiv>\n\n    <sc-if value=\"{{ s2 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px solid #f7d3df;border-radius:24px;padding:22px 20px;box-shadow:0 14px 34px rgba(181,48,95,.1);animation:rise .5s ease both\">\n        <div style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c9799a;font-weight:700\">Step 01<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-size:23px;color:#8a1f43;margin-top:6px\">The Three Commandments<\u002Fdiv>\n        <p style=\"margin:10px 0 16px;font-size:13.5px;line-height:1.65;color:#7a4f5d\">Chosen from your list. Realistic, useful, and slightly evil. Here they are, in writing:<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;gap:13px;align-items:center;background:linear-gradient(135deg,#fff4f8,#ffeaf1);border:1px solid #f8cddc;border-radius:18px;padding:14px 15px\">\n            <div style=\"width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#ffd9e5;display:flex;align-items:center;justify-content:center;font-size:17px\">🚫<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <div style=\"font-size:15.5px;font-weight:700;color:#8a1f43\">No Sugar<\u002Fdiv>\n              <div style=\"font-size:12px;color:#a8768a;margin-top:2px\">30 days. Yes, including the sneaky ones. 🫡<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:center;background:linear-gradient(135deg,#fff4f8,#ffeaf1);border:1px solid #f8cddc;border-radius:18px;padding:14px 15px\">\n            <div style=\"width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#ffd9e5;display:flex;align-items:center;justify-content:center;font-size:17px\">🏋️<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <div style=\"font-size:15.5px;font-weight:700;color:#8a1f43\">Gym / Workout<\u002Fdiv>\n              <div style=\"font-size:12px;color:#a8768a;margin-top:2px\">Showing up, not just posting about it. 💪<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:center;background:linear-gradient(135deg,#fff4f8,#ffeaf1);border:1px solid #f8cddc;border-radius:18px;padding:14px 15px\">\n            <div style=\"width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#ffd9e5;display:flex;align-items:center;justify-content:center;font-size:17px\">🍞<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <div style=\"font-size:15.5px;font-weight:700;color:#8a1f43\">No Maida<\u002Fdiv>\n              <div style=\"font-size:12px;color:#a8768a;margin-top:2px\">The hardest one. Pray for me. 🧠<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:15px;background:#fdf3f7;border-left:3px solid #ff9dbd;border-radius:0 12px 12px 0;padding:11px 13px;font-size:12.5px;line-height:1.6;color:#8a5567\">Locked in. No swapping later, no negotiating on day 9.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:22px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s3 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px solid #f7d3df;border-radius:24px;padding:22px 20px;box-shadow:0 14px 34px rgba(181,48,95,.1);animation:rise .5s ease both\">\n        <div style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c9799a;font-weight:700\">Step 02<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-size:23px;color:#8a1f43;margin-top:6px\">The Cheat Day Clause<\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.7;color:#5c3340;text-wrap:pretty\">You gave me four cheat days per challenge, because you are a loving and reasonable girlfriend. Noted, and appreciated.<\u002Fp>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.7;color:#5c3340;text-wrap:pretty\">But I want to say this properly: I understand I have lifelines, and I am going to try my best <em>not<\u002Fem> to use them. I want to actually do the full 30 days. Consistency, not excuses.<\u002Fp>\n\n        <div style=\"margin-top:16px;display:flex;gap:8px;flex-wrap:wrap\">\n          <div style=\"background:#fff0f5;border:1px solid #f8cddc;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;color:#a8446a\">Not a cheat week<\u002Fdiv>\n          <div style=\"background:#fff0f5;border:1px solid #f8cddc;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;color:#a8446a\">Not a cheat lifestyle<\u002Fdiv>\n          <div style=\"background:#fff0f5;border:1px solid #f8cddc;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;color:#a8446a\">Not “I forgot, baby”<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:20px;padding:16px;border-radius:18px;background:linear-gradient(150deg,#fff7ee,#ffeef4);border:1px dashed #f0b9a6\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"font-size:16px\">✈️<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:800;color:#a8446a;letter-spacing:.02em\">THE TANZANIA CLAUSE<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:13.5px;line-height:1.68;color:#6b4250;text-wrap:pretty\">One caveat, baby. As you know, I may be going to Tanzania. If that happens, I would like a little relaxation on those days, so a lifetime moment stays a lifetime moment and I can do it my way. Everything else stays exactly as written.<\u002Fp>\n          <p style=\"margin:10px 0 0;font-size:13.5px;line-height:1.68;color:#6b4250\">Requesting your approval, ma'am. 🙏<\u002Fp>\n\n          <sc-if value=\"{{ tanzPending }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;gap:9px;margin-top:14px\">\n              <button sc-camel-on-click=\"{{ approve }}\" style=\"flex:1;border:none;border-radius:14px;padding:12px 10px;background:#b5305f;color:#fff;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(181,48,95,.28)\">Approved 💕<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ discuss }}\" style=\"flex:1;border:1px solid #e8a9bf;border-radius:14px;padding:12px 10px;background:#fff;color:#a8446a;font-size:13px;font-weight:700;cursor:pointer\">We'll discuss 😏<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ tanzAnswered }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;background:#fff;border:1px solid #f4c8d8;border-radius:14px;padding:13px\">\n              <div style=\"font-family:'Caveat',cursive;font-size:21px;color:#b5305f\">{{ tanzTitle }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.6;color:#7a4f5d;margin-top:4px\">{{ tanzNote }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ resetTanz }}\" style=\"margin-top:10px;border:none;background:none;padding:0;font-size:11px;font-weight:700;color:#c9799a;cursor:pointer;letter-spacing:.06em\">CHANGE MY ANSWER<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <p style=\"margin:16px 0 0;font-size:12.5px;line-height:1.65;color:#8a5567\">Also agreed: for anything involving health, sleep, food, or exercise, we keep the rules safe and realistic. The goal is consistency, not punishment.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:22px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s4 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px solid #f7d3df;border-radius:24px;padding:22px 20px;box-shadow:0 14px 34px rgba(181,48,95,.1);animation:rise .5s ease both\">\n        <div style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c9799a;font-weight:700\">Step 03<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-size:23px;color:#8a1f43;margin-top:6px\">The Bonus-Point Clause<\u002Fdiv>\n        <p style=\"margin:10px 0 16px;font-size:13.5px;line-height:1.65;color:#7a4f5d\">Fully accepted. And I fully intend to farm these. Tick them for me when I earn them 😌<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ bonuses }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ b.toggle }}\" style=\"display:flex;gap:11px;align-items:flex-start;background:{{ b.bg }};border:1px solid {{ b.bd }};border-radius:15px;padding:12px 13px;cursor:pointer\">\n              <div style=\"width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:2px solid {{ b.box }};background:{{ b.fill }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800\">{{ b.mark }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.5;color:#5c3340;min-width:0\">{{ b.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;text-align:center;font-size:12px;font-weight:700;color:#b5305f\">{{ bonusCount }} of 6 bonus clauses ticked ♥<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:22px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s5 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:linear-gradient(160deg,#b5305f,#8a1f43 60%,#6e1637);border-radius:24px;padding:24px 20px;box-shadow:0 18px 40px rgba(110,22,55,.3);animation:rise .5s ease both;position:relative;overflow:hidden\">\n        <span style=\"position:absolute;top:-12px;right:-6px;font-size:78px;color:rgba(255,255,255,.08)\">♥<\u002Fspan>\n        <div style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#f4b6cc;font-weight:700;position:relative\">Step 04<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-size:24px;color:#fff;margin-top:6px;position:relative\">The Grand Reward 🎁<\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.7;color:#ffdde8;position:relative;text-wrap:pretty\">Your words: if I complete this, I get to ask you to do anything. Saree, hair colour, something special planned for us, a bold move on one knee, or the last thing on your list.<\u002Fp>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.7;color:#ffdde8;position:relative\">Honestly? The list alone was enough motivation. The last one is criminally fascinating. 😏<\u002Fp>\n\n        <div style=\"margin-top:18px;background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.4);border-radius:18px;padding:16px;position:relative\">\n          <div style=\"font-size:10.5px;letter-spacing:.16em;color:#f4b6cc;font-weight:700\">MY CHOSEN REWARD<\u002Fdiv>\n          <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:10px;font-family:'Caveat',cursive;font-size:27px;color:#fff;filter:blur(5px);user-select:none\">classified until day 30<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ peek }}\" style=\"margin-top:12px;width:100%;border:none;border-radius:13px;padding:12px;background:#fff;color:#8a1f43;font-size:13px;font-weight:800;cursor:pointer\">Tap to peek 👀<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ peeked }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;font-family:'Caveat',cursive;font-size:26px;color:#fff;line-height:1.25\">Nothing written here. Yet.<\u002Fdiv>\n            <p style=\"margin:8px 0 0;font-size:13px;line-height:1.65;color:#ffdde8\">I am deliberately not writing my reward down. I will tell you after I complete the 30 days, face to face. Some things deserve a live announcement. 💍😂<\u002Fp>\n            <button sc-camel-on-click=\"{{ relock }}\" style=\"margin-top:10px;border:none;background:none;padding:0;font-size:11px;font-weight:700;color:#f4b6cc;cursor:pointer;letter-spacing:.06em\">HIDE IT AGAIN<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:22px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s6 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px solid #f7d3df;border-radius:24px;padding:22px 20px;box-shadow:0 14px 34px rgba(181,48,95,.1);animation:rise .5s ease both\">\n        <div style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c9799a;font-weight:700\">Step 05<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-size:23px;color:#8a1f43;margin-top:6px\">Terms &amp; Conditions<\u002Fdiv>\n        <p style=\"margin:10px 0 16px;font-size:13.5px;line-height:1.65;color:#7a4f5d\">Read fully. Accepted fully. No creative accounting.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <sc-for list=\"{{ terms }}\" as=\"t\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;gap:11px;align-items:flex-start\">\n              <span style=\"width:19px;height:19px;flex:0 0 19px;border-radius:50%;background:#ffd9e5;color:#8a1f43;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px\">✓<\u002Fspan>\n              <span style=\"font-size:13.5px;line-height:1.58;color:#5c3340;min-width:0\">{{ t.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;background:#fdf3f7;border-radius:14px;padding:12px 13px;font-size:12.5px;line-height:1.62;color:#8a5567\">Girlfriend surveillance: consented to in advance. 👀 No fake screenshots, no “technically I did it”. If I miss a day, you will hear it from me first.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:22px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s7 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fffdf9;border:1px solid #f2dcc9;border-radius:24px;padding:24px 20px;box-shadow:0 14px 34px rgba(181,48,95,.1);animation:rise .5s ease both;background-image:linear-gradient(#fffdf9,#fff8f3)\">\n        <div style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c09a7a;font-weight:700\">Step 06<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-size:23px;color:#8a1f43;margin-top:6px\">Final Declaration<\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-family:'Playfair Display',serif;font-size:15px;line-height:1.8;color:#4a2530;text-wrap:pretty\">I, <strong style=\"font-family:'Caveat',cursive;font-size:23px;color:#b5305f\">Satvik Mangal<\u002Fstrong>, hereby accept this challenge and understand that 30 days of discipline may result in an extremely happy girlfriend and one very interesting reward.<\u002Fp>\n\n        <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:16px\">\n          <div>\n            <div style=\"font-family:'Caveat',cursive;font-size:30px;color:#3a2b33;line-height:1;animation:wiggle 6s ease-in-out infinite\">Satvik Mangal<\u002Fdiv>\n            <div style=\"border-top:1px solid #ddc7b4;margin-top:6px;padding-top:5px;font-size:10px;letter-spacing:.16em;color:#a8927f;font-weight:700\">BOYFRIEND'S SIGNATURE<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Caveat',cursive;font-size:30px;color:#b5305f;line-height:1\">Cheshta Agarwal<\u002Fdiv>\n            <div style=\"border-top:1px solid #ddc7b4;margin-top:6px;padding-top:5px;font-size:10px;letter-spacing:.16em;color:#a8927f;font-weight:700\">GIRLFRIEND'S SIGNATURE<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Caveat',cursive;font-size:22px;color:#6b5a50;line-height:1\">God, and the two of us<\u002Fdiv>\n            <div style=\"border-top:1px solid #ddc7b4;margin-top:6px;padding-top:5px;font-size:10px;letter-spacing:.16em;color:#a8927f;font-weight:700\">WITNESS<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ unsigned }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ sign }}\" style=\"margin-top:22px;width:100%;border:none;border-radius:16px;padding:15px;background:linear-gradient(100deg,#ff7aa8,#b5305f,#ff7aa8);background-size:200% 100%;animation:shine 4s linear infinite;color:#fff;font-size:14.5px;font-weight:800;letter-spacing:.03em;cursor:pointer;box-shadow:0 10px 24px rgba(181,48,95,.3)\">Stamp it — I'm in for 30 days ♥<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ signed }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:22px;border:2px solid #b5305f;border-radius:16px;padding:14px;text-align:center;transform:rotate(-1.5deg);background:#fff5f8\">\n            <div style=\"font-size:10px;letter-spacing:.2em;color:#c9799a;font-weight:800\">EXECUTED &amp; BINDING<\u002Fdiv>\n            <div style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:19px;color:#8a1f43;margin-top:4px\">Contract Accepted<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#a8768a;margin-top:3px;font-weight:600\">14 September 2026 · 30 days · 3 commandments<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"height:22px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s8 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px solid #f7d3df;border-radius:24px;padding:22px 20px;box-shadow:0 14px 34px rgba(181,48,95,.1);animation:rise .5s ease both\">\n        <div style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c9799a;font-weight:700\">The scoreboard<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-size:23px;color:#8a1f43;margin-top:6px\">30 Days, One Heart Each<\u002Fdiv>\n        <p style=\"margin:10px 0 16px;font-size:13.5px;line-height:1.65;color:#7a4f5d\">Tap a day when I have done all three. Your board, your verdict. It saves automatically.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:8px\">\n          <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"30\">\n            <button sc-camel-on-click=\"{{ d.toggle }}\" style=\"aspect-ratio:1;border:1px solid {{ d.bd }};border-radius:13px;background:{{ d.bg }};color:{{ d.fg }};font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\">{{ d.face }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;background:#fdf3f7;border-radius:16px;padding:14px;text-align:center\">\n          <div style=\"font-family:'Playfair Display',serif;font-size:26px;color:#b5305f\">{{ dayCount }} / 30<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#a8768a;font-weight:700;letter-spacing:.04em;margin-top:2px\">{{ dayLine }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:22px\"><\u002Fdiv>\n\n      <div style=\"background:linear-gradient(160deg,#ffeef4,#ffe0ea);border:1px solid #f8cddc;border-radius:24px;padding:26px 20px;text-align:center;animation:rise .5s ease both\">\n        <div style=\"font-size:26px;animation:beat 1.8s ease-in-out infinite\">💕<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:#8a1f43;margin-top:10px;line-height:1.3\">Thank you so much, Tina,<br>for thinking about me.<\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.72;color:#6b4250;text-wrap:pretty\">You could have just asked me to drink more water. Instead you built me a whole contract with clauses, cheat days and a grand reward. That is the most you thing ever, and I love it.<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.72;color:#6b4250\">30 days starts tomorrow. I will make you proud. And you should start preparing for that reward request, because I am thinking very carefully about it. 😉<\u002Fp>\n        <div style=\"margin-top:18px;font-family:'Caveat',cursive;font-size:25px;color:#b5305f\">— Your favourite problem, Satvik<\u002Fdiv>\n        <div style=\"margin-top:14px;display:flex;gap:6px;justify-content:center;color:#e8a9bf;font-size:13px\">\n          <span>♥<\u002Fspan><span>♡<\u002Fspan><span>♥<\u002Fspan><span>♡<\u002Fspan><span>♥<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:30px\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"height:6px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasNext }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:sticky;bottom:0;left:0;right:0;z-index:40;padding:12px 18px 16px;background:linear-gradient(to top,rgba(249,230,237,.99) 40%,rgba(249,230,237,0))\">\n      <div style=\"max-width:394px;margin:0 auto;display:flex;align-items:center;gap:12px\">\n        <div style=\"display:flex;gap:5px;flex:0 0 auto\">\n          <sc-for list=\"{{ dots }}\" as=\"dot\" hint-placeholder-count=\"7\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:{{ dot.bg }};display:block\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ next }}\" style=\"flex:1;border:none;border-radius:16px;padding:14px;background:#b5305f;color:#fff;font-size:13.5px;font-weight:800;letter-spacing:.03em;cursor:pointer;box-shadow:0 10px 22px rgba(181,48,95,.3)\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ closed }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ open }}\" style=\"position:fixed;inset:0;z-index:80;background:radial-gradient(120% 70% at 50% 30%,#ffe4ec,#f6d3e0 60%,#eebfd0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;padding:30px\">\n      <div style=\"font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#b5748f;font-weight:800\">A reply for cheshta<\u002Fdiv>\n      <div style=\"width:min(300px,80vw);aspect-ratio:1.5;border-radius:18px;background:linear-gradient(160deg,#fff,#ffeef4);border:1px solid #f2bfd1;box-shadow:0 22px 50px rgba(138,31,67,.22);position:relative;display:flex;align-items:center;justify-content:center;animation:floaty 5s ease-in-out infinite\">\n        <div style=\"position:absolute;top:0;left:0;right:0;height:62%;background:linear-gradient(165deg,#ffdbe7,#ffcadb);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:18px 18px 0 0\"><\u002Fdiv>\n        <div style=\"width:54px;height:54px;border-radius:50%;background:#b5305f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:2;box-shadow:0 8px 20px rgba(181,48,95,.35);animation:beat 1.7s ease-in-out infinite\">♥<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:20px;color:#8a1f43;text-align:center\">Tap to open your contract<\u002Fdiv>\n      <div style=\"font-size:12px;color:#b5748f;font-weight:600\">signed, sealed, and slightly nervous<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div ref=\"{{ heartRef }}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { opened: false, step: 1, tanz: null, peeked: false, signed: false, days: {}, bonus: {} };\n  KEY = \"contract-30day-satvik-v1\";\n  TOTAL = 7;\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(this.KEY);\n      if (raw) {\n        const d = JSON.parse(raw) || {};\n        this.setState({\n          opened: !!d.opened, step: d.step || 1, tanz: d.tanz || null,\n          peeked: !!d.peeked, signed: !!d.signed, days: d.days || {}, bonus: d.bonus || {}\n        });\n      }\n    } catch (e) {}\n  }\n\n  put(patch) {\n    const n = Object.assign({}, this.state, patch);\n    try {\n      localStorage.setItem(this.KEY, JSON.stringify({\n        opened: n.opened, step: n.step, tanz: n.tanz, peeked: n.peeked,\n        signed: n.signed, days: n.days, bonus: n.bonus\n      }));\n    } catch (e) {}\n    this.setState(patch);\n  }\n\n  burst(count) {\n    const box = this.heartBox;\n    if (!box) return;\n    const glyphs = [\"\\u2665\", \"\\u2661\", \"\\u273f\", \"\\u2726\", \"\\ud83d\\udc95\"];\n    const cols = [\"#ff7aa8\", \"#b5305f\", \"#ffb3c9\", \"#ff96b8\", \"#e8639a\"];\n    for (let i = 0; i < count; i++) {\n      const s = document.createElement(\"span\");\n      s.textContent = glyphs[i % glyphs.length];\n      s.style.cssText = \"position:fixed;left:\" + (6 + Math.random() * 88) + \"%;bottom:-30px;font-size:\" +\n        (13 + Math.random() * 22) + \"px;color:\" + cols[i % cols.length] + \";pointer-events:none;z-index:95\";\n      box.appendChild(s);\n      const a = s.animate(\n        [{ transform: \"translateY(0) rotate(0deg)\", opacity: 1 },\n         { transform: \"translateY(-\" + (280 + Math.random() * 480) + \"px) rotate(\" + (Math.random() * 420 - 210) + \"deg)\", opacity: 0 }],\n        { duration: 1700 + Math.random() * 1400, easing: \"cubic-bezier(.18,.7,.3,1)\", delay: Math.random() * 350 }\n      );\n      a.onfinish = () => s.remove();\n    }\n  }\n\n  bonusList() {\n    return [\n      \"Completing a challenge without being reminded.\",\n      \"Sending proof in a cute or creative way.\",\n      \"Encouraging you to join me.\",\n      \"Going above and beyond on a difficult day.\",\n      \"Completing a thoughtful romantic gesture.\",\n      \"Admitting honestly when I miss a habit instead of making excuses.\"\n    ];\n  }\n\n  termsList() {\n    return [\n      \"The challenge starts on 14 September 2026.\",\n      \"The challenge ends on 13 October 2026.\",\n      \"All three challenges will be attempted consistently.\",\n      \"Up to four cheat days available per challenge \\u2014 to be used as a last resort, not a plan.\",\n      \"Honesty is mandatory. Surveillance is welcome.\",\n      \"No fake screenshots, no creative accounting, no \\u201ctechnically I did it\\u201d.\",\n      \"Missed days get acknowledged honestly, same day.\",\n      \"Either of us may modify a challenge if it becomes unrealistic, unhealthy, or unfair.\"\n    ];\n  }\n\n  renderVals() {\n    const st = this.state;\n    const step = st.step;\n    const tanzTitles = { yes: \"Approved, baby \\u2713\", talk: \"Pending discussion \\u2026\" };\n    const tanzNotes = {\n      yes: \"Tanzania days get adjusted rules. Thank you, ma'am \\u2014 noted in the contract and not to be abused.\",\n      talk: \"Fair enough. We'll settle the Tanzania terms before I fly. Everything else stands as signed.\"\n    };\n    const dayCount = Object.keys(st.days).filter(k => st.days[k]).length;\n    const bonusCount = Object.keys(st.bonus).filter(k => st.bonus[k]).length;\n\n    const dayLines = [\"Day one energy. Let's go.\", \"Warming up.\", \"Building the streak.\", \"Now it's a habit.\", \"Almost an upgraded boyfriend.\", \"Completed. Reward request incoming \\ud83d\\ude09\"];\n    let dl = dayLines[0];\n    if (dayCount >= 30) dl = dayLines[5];\n    else if (dayCount >= 22) dl = dayLines[4];\n    else if (dayCount >= 14) dl = dayLines[3];\n    else if (dayCount >= 6) dl = dayLines[2];\n    else if (dayCount >= 1) dl = dayLines[1];\n\n    const days = [];\n    for (let i = 1; i <= 30; i++) {\n      const done = !!st.days[i];\n      days.push({\n        n: i, face: done ? \"\\u2665\" : String(i),\n        bg: done ? \"#b5305f\" : \"#fff5f8\",\n        fg: done ? \"#ffffff\" : \"#c08099\",\n        bd: done ? \"#b5305f\" : \"#f6d3e0\",\n        toggle: () => {\n          const nd = Object.assign({}, this.state.days);\n          if (nd[i]) delete nd[i]; else { nd[i] = true; this.burst(6); }\n          this.put({ days: nd });\n        }\n      });\n    }\n\n    const bonuses = this.bonusList().map((label, i) => {\n      const on = !!st.bonus[i];\n      return {\n        label: label, mark: on ? \"\\u2713\" : \"\",\n        bg: on ? \"#fff0f5\" : \"#ffffff\",\n        bd: on ? \"#f4b6cc\" : \"#f7e0e8\",\n        box: on ? \"#b5305f\" : \"#e8c3d1\",\n        fill: on ? \"#b5305f\" : \"transparent\",\n        toggle: () => {\n          const nb = Object.assign({}, this.state.bonus);\n          if (nb[i]) delete nb[i]; else { nb[i] = true; this.burst(4); }\n          this.put({ bonus: nb });\n        }\n      };\n    });\n\n    const dots = [];\n    for (let i = 1; i <= this.TOTAL; i++) dots.push({ bg: i <= step ? \"#b5305f\" : \"#f0c2d3\" });\n\n    const labels = [\"\", \"Show me my three \\u2192\", \"Next: the cheat days \\u2192\", \"Next: bonus points \\u2192\", \"Next: the reward \\ud83c\\udf81\", \"Next: terms \\u2192\", \"Sign it \\u2712\\ufe0f\", \"See the scoreboard \\u2192\"];\n\n    return {\n      closed: !st.opened,\n      open: () => { this.put({ opened: true }); this.burst(18); },\n      s2: step >= 2, s3: step >= 3, s4: step >= 4, s5: step >= 5, s6: step >= 6, s7: step >= 7, s8: step >= 7,\n      hasNext: st.opened && step < this.TOTAL,\n      nextLabel: labels[step] || \"Next \\u2192\",\n      next: () => { this.put({ step: Math.min(this.TOTAL, this.state.step + 1) }); this.burst(5); },\n      dots: dots,\n      tanzPending: !st.tanz,\n      tanzAnswered: !!st.tanz,\n      tanzTitle: st.tanz ? tanzTitles[st.tanz] : \"\",\n      tanzNote: st.tanz ? tanzNotes[st.tanz] : \"\",\n      approve: () => { this.put({ tanz: \"yes\" }); this.burst(16); },\n      discuss: () => this.put({ tanz: \"talk\" }),\n      resetTanz: () => this.put({ tanz: null }),\n      locked: !st.peeked,\n      peeked: st.peeked,\n      peek: () => { this.put({ peeked: true }); this.burst(10); },\n      relock: () => this.put({ peeked: false }),\n      unsigned: !st.signed,\n      signed: st.signed,\n      sign: () => { this.put({ signed: true }); this.burst(34); },\n      bonuses: bonuses, bonusCount: bonusCount,\n      terms: this.termsList().map(t => ({ text: t })),\n      days: days, dayCount: dayCount, dayLine: dl,\n      heartRef: el => { this.heartBox = el; }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
